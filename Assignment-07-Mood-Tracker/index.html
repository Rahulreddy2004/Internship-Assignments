<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mood Tracker | Assignment 7</title>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState } = React;

        function MoodTracker() {
            // 1. Define State
            const [mood, setMood] = useState("Neutral");
            const [color, setColor] = useState("#f0f2f5");

            // 2. Handle Mood Change
            const updateMood = (newMood, newColor) => {
                setMood(newMood);
                setColor(newColor);
            };

            return (
                <div className="app-container" style={{ backgroundColor: color }}>
                    <div className="mood-card">
                        <h1>How are you feeling?</h1>
                        <div className="current-mood">
                            Current Mood: <strong>{mood}</strong>
                        </div>
                        
                        <div className="button-group">
                            <button onClick={() => updateMood("Happy 😃", "#fff9c4")}>Happy</button>
                            <button onClick={() => updateMood("Productive 🚀", "#c8e6c9")}>Productive</button>
                            <button onClick={() => updateMood("Relaxed 🌊", "#bbdefb")}>Relaxed</button>
                            <button onClick={() => updateMood("Tired 😴", "#e1bee7")}>Tired</button>
                        </div>

                        <button className="reset-btn" onClick={() => updateMood("Neutral", "#f0f2f5")}>Reset</button>
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<MoodTracker />);
    </script>
</body>
</html>
